<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FixGrammar Settings</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 16px; }
      label { display:block; margin-top:12px; }
      select, button { margin-top:8px; }
    </style>
  </head>
  <body>
    <h2>FixGrammar — Settings</h2>
    <label for="service">Grammar service</label>
    <select id="service">
      <option value="https://api.languagetool.org/v2/check">LanguageTool (https://api.languagetool.org) - Free, Open-source</option>
    </select>
    <div>
      <button id="save">Save</button>
      <button id="reset">Reset to default</button>
    </div>
    <script src="options.js"></script>
  </body>
</html>
