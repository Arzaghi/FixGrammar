name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run test suite
        run: npm test

  release:
    name: Build and publish extension
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build CRX and ZIP packages
        run: |
          rm -rf release build
          mkdir -p release build

          if [ -n "${{ secrets.CRX_PRIVATE_KEY }}" ]; then
            printf '%s\n' "${{ secrets.CRX_PRIVATE_KEY }}" > release/key.pem
          else
            npx crx keygen --directory release
          fi

          cp -R manifest.json background.js content.js options icons build/

          npx crx pack build \
            --output release/fixgrammar-chrome-extension.crx \
            --zip-output release/fixgrammar-chrome-extension.zip \
            --private-key release/key.pem

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: fixgrammar-${{ github.run_number }}
          release_name: FixGrammar Release ${{ github.run_number }}
          body: |-
            Automated release created by GitHub Actions.
            Includes the converted Chrome extension package ready for download.
          draft: false
          prerelease: false

      - name: Upload ZIP release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/fixgrammar-chrome-extension.zip
          asset_name: fixgrammar-chrome-extension.zip
          asset_content_type: application/zip

      - name: Upload CRX release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/fixgrammar-chrome-extension.crx
          asset_name: fixgrammar-chrome-extension.crx
          asset_content_type: application/x-chrome-extension
