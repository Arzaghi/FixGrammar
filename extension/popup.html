<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FixGrammar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #f8f9fa;
      --text-primary: #1f2328;
      --card-bg: #ffffff;
      --card-border: #e1e4e8;
      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
      --input-bg: #fafafa;
      --input-border: #dadce0;
      --divider: #eaecef;
      --status-bg: #ffffff;
      --status-border: #e1e4e8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0f1117;
        --text-primary: #e8eaed;
        --text-secondary: #8a91a8;
        --text-muted: #6b7385;
        --card-bg: #1a1d27;
        --card-border: #252836;
        --card-shadow: none;
        --input-bg: #12141c;
        --input-border: #2e3346;
        --divider: #1e2130;
        --status-bg: #1a1d27;
        --status-border: #252836;
      }
    }

    body {
      height: 100vh;
      min-height: 100vh;
      width: 100%;
      min-width: 0;
      max-width: none;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 18px 16px 14px;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .icon-btn {
      min-width: 70px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-shrink: 0;
      padding: 0 8px;
      border-radius: 7px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.2s;
    }
    .icon-btn:hover {
      background: rgba(66, 133, 244, 0.1);
      border-color: #4285f4;
      color: #4285f4;
      transform: translateY(-1px);
    }
    .settings-icon { font-size: 13px; line-height: 1; }

    /* ── Status bar ──────────────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      background: var(--status-bg);
      border: 1px solid var(--status-border);
      border-radius: 10px;
      box-shadow: var(--card-shadow);
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }
    .status-bar.warn { border-color: rgba(249, 171, 0, 0.4); cursor: pointer; }
    .gemini-status-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: block;
    }
    .status-bar.warn .gemini-status-icon { color: #f9ab00; }
    .status-bar.warn .gemini-status-icon path { fill: currentColor; }
    .status-label {
      font-size: 12.5px;
      color: var(--text-secondary);
      flex: 1;
    }
    .status-bar.warn .status-label { color: #9a6700; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .status-bar.warn .status-label { color: #f9ab00; }
    }
    .status-action {
      display: none;
      font-size: 11px;
      font-weight: 700;
      color: #4285f4;
      background: rgba(66, 133, 244, 0.1);
      border: 1px solid rgba(66, 133, 244, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .status-action:hover { background: rgba(66, 133, 244, 0.18); border-color: #4285f4; }
    .status-action.visible { display: inline-flex; align-items: center; }

    .selection-panel { margin-bottom: 0; }
    .language-section { min-width: 0; }
    .fav-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
    .fav-header {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .add-lang-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(66, 133, 244, 0.45);
      background: rgba(66, 133, 244, 0.15);
      color: #4285f4;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      transition: all 0.18s;
    }
    .add-lang-btn:hover { background: rgba(66, 133, 244, 0.28); border-color: rgba(66, 133, 244, 0.7); }
    .fav-pills { display: flex; flex-wrap: wrap; gap: 5px; }
    .fav-pill {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fav-pill:hover { background: rgba(66, 133, 244, 0.1); border-color: #a9c3f5; color: #4285f4; }
    .fav-pill.active { background: rgba(66, 133, 244, 0.12); border-color: #4285f4; color: #1a56db; font-weight: 600; box-shadow: 0 0 0 1px rgba(66, 133, 244, 0.15); }
    .fav-empty { font-size: 11px; color: var(--text-muted); font-style: italic; }

    .tone-section { min-width: 0; }
    .tone-label { display: block; margin-bottom: 7px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); font-weight: 600; }
    .tone-buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }
    .tone-button {
      min-height: 62px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 5px;
      border-radius: 9px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-secondary);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }
    .tone-button:hover { background: rgba(66, 133, 244, 0.1); border-color: #a9c3f5; color: #4285f4; }
    .tone-button.active { background: rgba(66, 133, 244, 0.12); border-color: #4285f4; color: #1a56db; font-weight: 600; box-shadow: 0 0 0 1px rgba(66, 133, 244, 0.12); }
    .tone-button:disabled { cursor: not-allowed; opacity: 0.42; filter: grayscale(1); }
    .tone-icon { width: 24px; height: 24px; display: block; }
    .tone-icon svg { width: 100%; height: 100%; display: block; }
    .tone-name { display: block; font-size: 11px; }

    /* ── Error banner ────────────────────────────────────────────── */
    .error-banner {
      background: rgba(198, 40, 40, 0.12);
      border: 1px solid rgba(198, 40, 40, 0.35);
      color: #d93025;
      font-size: 12px;
      padding: 8px 10px 8px 11px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: none;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }
    @media (prefers-color-scheme: dark) {
      .error-banner {
        background: rgba(198, 40, 40, 0.15);
        border-color: rgba(198, 40, 40, 0.4);
        color: #ef9a9a;
      }
    }
    .error-banner.visible { display: flex; }
    .error-text { flex: 1; }

    /* ── Translate card ──────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      padding: 14px;
      margin-bottom: 10px;
    }
    .editor-panel {
      flex: 1 1 0;
      min-height: 120px;
      display: flex;
      flex-direction: column;
    }
    .editor-panel .textarea-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
    }

    textarea {
      width: 100%;
      height: 100%;
      min-height: 0;
      resize: vertical;
      padding: 10px 38px 10px 11px;
      border: 1.5px solid var(--input-border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--input-bg);
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.18);
    }
    textarea:disabled { cursor: not-allowed; opacity: 0.52; filter: grayscale(0.7); }

    .textarea-wrap { position: relative; }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1;
      opacity: 0.9;
      transition: opacity 0.15s, border-color 0.15s, color 0.15s;
    }
    .copy-btn:hover { opacity: 1; border-color: #4285f4; color: #4285f4; }
    .copy-btn.copied { border-color: #34a853; color: #137333; }
    .copy-btn.failed { border-color: #d93025; color: #d93025; }
    .copy-btn svg { width: 15px; height: 15px; display: block; }
    .copy-btn:disabled,
    .add-lang-btn:disabled,
    .fav-pill:disabled { cursor: not-allowed; opacity: 0.42; filter: grayscale(1); }
    @media (prefers-color-scheme: dark) {
      .copy-btn.copied { color: #81c995; }
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(248, 249, 250, 0.72);
      border-radius: 8px;
      pointer-events: none;
    }
    @media (prefers-color-scheme: dark) {
      .loading-overlay { background: rgba(15, 17, 23, 0.72); }
    }
    .loading-overlay.visible { display: flex; }
    .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(66, 133, 244, 0.22);
      border-top-color: #4285f4;
      animation: spin 0.7s linear infinite;
    }

    select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      padding: 9px 30px 9px 12px;
      border: 1.5px solid var(--input-border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--input-bg);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    select:hover {
      border-color: #a9c3f5;
    }
    select:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.18);
    }

    .actions-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin-top: 12px;
    }
    .actions-row .icon-btn {
      min-width: 0;
      height: auto;
      margin-left: 0;
      padding: 10px 14px;
      border: 1.5px solid var(--input-border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      transform: none;
      transition: border-color 0.15s, color 0.15s, opacity 0.15s;
    }
    .actions-row .icon-btn:hover {
      border-color: #4285f4;
      background: var(--input-bg);
      color: #4285f4;
      transform: none;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
    }
    .translate-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      background: linear-gradient(135deg, #4285f4, #9b72cb);
      color: #fff;
      transition: filter 0.15s, opacity 0.15s;
    }
    .translate-btn:hover:not(:disabled) { filter: brightness(1.08); }
    .translate-btn:disabled { opacity: 0.75; cursor: not-allowed; }
    .translate-btn.locked {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-muted);
      opacity: 0.52;
      filter: grayscale(1);
      box-shadow: none;
    }

    .btn-spinner {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      animation: spin 0.7s linear infinite;
      display: none;
      flex-shrink: 0;
    }
    .translate-btn.loading .btn-spinner { display: inline-block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .undo-btn {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      color: var(--text-secondary);
      transition: border-color 0.15s, color 0.15s, opacity 0.15s;
    }
    .undo-btn:hover:not(:disabled) {
      border-color: #4285f4;
      color: #4285f4;
    }
    .undo-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    @media (max-height: 620px) {
      body { min-height: 760px; }
      .editor-panel { flex: 0 0 240px; }
    }

  </style>
</head>
<body>
  <div class="status-bar" id="statusBar">
    <svg class="gemini-status-icon" id="statusDot" viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <linearGradient id="geminiStatusGradient" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#4285f4"/>
          <stop offset="0.5" stop-color="#9b72cb"/>
          <stop offset="1" stop-color="#d96570"/>
        </linearGradient>
      </defs>
      <path d="M12 0c0 6.075 5.925 12 12 12-6.075 0-12 5.925-12 12 0-6.075-5.925-12-12-12C6.075 12 12 6.075 12 0Z" fill="url(#geminiStatusGradient)"/>
    </svg>
    <span class="status-label" id="statusLabel">Gemini</span>
    <button class="status-action" id="statusAction" type="button">Open Settings</button>
  </div>

  <div class="error-banner" id="errorBanner">
    <span class="error-text" id="errorText"></span>
  </div>

  <div class="card editor-panel">
    <div class="textarea-wrap">
      <textarea id="textInput" placeholder="Type or paste text here…" spellcheck="true"></textarea>
      <button class="copy-btn" id="copyBtn" title="Copy text" aria-label="Copy text" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="8" y="8" width="11" height="12" rx="2"></rect>
          <path d="M16 8V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h1"></path>
        </svg>
      </button>
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
      </div>
    </div>

  </div>

  <div class="card selection-panel">
    <div class="language-section">
        <div class="fav-header-row">
          <div class="fav-header">Target language</div>
          <button class="add-lang-btn" id="addLangBtn" title="Add languages in Settings" type="button">+</button>
        </div>
        <div class="fav-pills" id="favPills"></div>
      </div>

  </div>

  <div class="card selection-panel">
    <div class="tone-section">
        <span class="tone-label">Output tone</span>
        <div class="tone-buttons" id="toneButtons">
        <button class="tone-button" data-tone="neutral" title="Natural and faithful" type="button">
          <span class="tone-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M5 7h14M8 7l-3 6h6L8 7ZM16 7l-3 6h6l-3-6ZM8 20h8"/></svg></span>
          <span class="tone-name">Neutral</span>
        </button>
        <button class="tone-button" data-tone="formal" title="Formal and polished" type="button">
          <span class="tone-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9l3 3V20.5H6z"/><path d="M14 3.5v4h4M9 12h6M9 16h6"/></svg></span>
          <span class="tone-name">Formal</span>
        </button>
        <button class="tone-button" data-tone="casual" title="Relaxed and conversational" type="button">
          <span class="tone-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h12a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H9l-3 3v-3a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2z"/><path d="M8 5h8a2 2 0 0 1 2 2v2M8 13h.01M12 13h.01M16 13h.01"/></svg></span>
          <span class="tone-name">Casual</span>
        </button>
        <button class="tone-button" data-tone="friendly" title="Warm and friendly" type="button">
          <span class="tone-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5S4.5 16.2 4.5 10.2A4.2 4.2 0 0 1 12 7.8a4.2 4.2 0 0 1 7.5 2.4c0 6-7.5 10.3-7.5 10.3Z"/><path d="M8.5 12h.01M15.5 12h.01"/></svg></span>
          <span class="tone-name">Friendly</span>
        </button>
        <button class="tone-button" data-tone="professional" title="Business professional" type="button">
          <span class="tone-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M4 12h16M10 12v2h4v-2"/></svg></span>
          <span class="tone-name">Business</span>
        </button>
          <button class="tone-button" data-tone="concise" title="Short and direct" type="button">
          <span class="tone-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h10M5 17h6"/><path d="m17 15 2 2 3-4"/></svg></span>
          <span class="tone-name">Brief</span>
          </button>
        <button class="tone-button" data-tone="email" title="Format as a standard email" type="button">
          <span class="tone-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m5 7 7 5 7-5M5 17l4-4M19 17l-4-4"/></svg></span>
          <span class="tone-name">Email</span>
        </button>
        <button class="tone-button" data-tone="funny" title="Add light, appropriate humor" type="button">
          <span class="tone-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8 14c1 1.5 2.3 2.2 4 2.2s3-.7 4-2.2M8.5 9.5h.01M15.5 9.5h.01"/></svg></span>
          <span class="tone-name">Funny</span>
        </button>
        </div>
      </div>
    </div>
  </div>

  <div class="actions-row">
    <button class="translate-btn" id="translateBtn"><span class="btn-spinner"></span><span id="translateBtnText">Translate</span></button>
    <button class="undo-btn" id="undoBtn" disabled title="Revert to original text">↩ Undo</button>
    <button class="icon-btn" id="settingsBtn" title="Open extension settings" aria-label="Open extension settings" type="button"><span class="settings-icon" aria-hidden="true">⚙</span><span>Settings</span></button>
  </div>

  <script src="models.js"></script>
  <script src="languages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
